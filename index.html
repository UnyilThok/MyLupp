    <style>
        :root{--accent:#ff007f;--accent-glow:rgba(255,0,127,0.4);--glass-bg:rgba(255,255,255,0.07);--glass-border:rgba(255,255,255,0.12);--glass-blur:50px;--text-primary:#fff;--ease-out:cubic-bezier(0.19,1,0.22,1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050505;font-family:'Poppins',sans-serif;color:var(--text-primary);overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:100vh;-webkit-tap-highlight-color:transparent}
        .script-font{font-family:'Dancing Script',cursive}
        #hearts-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

        .corner-flower{position:fixed;font-size:2.5rem;z-index:5;pointer-events:none;opacity:.7;filter:drop-shadow(0 0 8px var(--accent-glow))}
        .flower-tl{top:15px;left:15px;animation:floatTL 4s ease-in-out infinite}
        .flower-tr{top:15px;right:15px;animation:floatTR 4.5s ease-in-out infinite}
        .flower-bl{bottom:15px;left:15px;animation:floatBL 5s ease-in-out infinite}
        .flower-br{bottom:15px;right:15px;animation:floatBR 4.2s ease-in-out infinite}
        @keyframes floatTL{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(8px,10px) rotate(15deg)}}
        @keyframes floatTR{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-8px,10px) rotate(-15deg)}}
        @keyframes floatBL{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(8px,-10px) rotate(-10deg)}}
        @keyframes floatBR{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-8px,-10px) rotate(10deg)}}
        .card{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);padding:22px 18px;border-radius:36px;text-align:center;width:88%;max-width:400px;transition:all .6s var(--ease-out);z-index:10;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);position:relative;overflow:hidden;animation:cardEntrance .8s var(--ease-out) both}
        @keyframes cardEntrance{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .card-glow{position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 60%);opacity:.15;pointer-events:none;animation:glowRotate 8s linear infinite}
        @keyframes glowRotate{to{transform:rotate(360deg)}}
        .card.hidden{opacity:0;transform:translateY(80px) scale(.85);pointer-events:none}
        h1{font-size:1.8rem;margin-bottom:2px;text-shadow:0 0 25px var(--accent);transition:color .5s,opacity .3s}
        h1.pulse{animation:heartbeat .6s ease}
        @keyframes heartbeat{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(.97)}100%{transform:scale(1)}}
        .live-clock{font-size:2rem;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 20px var(--accent-glow);margin-bottom:1px;line-height:1.2}
        .live-date-gregorian{font-size:.7rem;opacity:.55;margin-bottom:1px}
        .live-date-hijri{font-size:.65rem;opacity:.45;margin-bottom:8px;font-style:italic;letter-spacing:.3px}
        .visualizer{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:20px;margin-bottom:8px;opacity:0;transition:opacity .3s}
        .visualizer.active{opacity:1}
        .bar{width:3px;background:var(--accent);border-radius:2px;animation:bounce .4s infinite alternate}
        .bar:nth-child(1){animation-delay:0s}.bar:nth-child(2){animation-delay:.08s}.bar:nth-child(3){animation-delay:.16s}.bar:nth-child(4){animation-delay:.24s}.bar:nth-child(5){animation-delay:.32s}
        @keyframes bounce{from{height:4px;opacity:.4}to{height:20px;opacity:1}}
        .memory-container{position:relative;margin-bottom:4px}
        .text-box{font-size:.88rem;line-height:1.75;min-height:70px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:10px 8px;border-radius:15px;transition:background .3s,opacity .4s ease,transform .2s ease;font-weight:300;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;hyphens:auto;text-align:center;max-width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}

        .btn.active-toggle{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
        .counter-badge{display:inline-block;background:rgba(0,0,0,.4);border:1px solid var(--accent);padding:6px 18px;border-radius:30px;font-size:.75rem;font-weight:600;box-shadow:0 0 15px var(--accent-glow)}
        .location-selector{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px}

        .eye-btn{position:fixed;bottom:25px;right:25px;z-index:100;background:var(--accent);border-radius:50%;width:46px;height:46px;border:none;color:white;font-size:1.2rem;cursor:pointer;box-shadow:0 0 20px var(--accent-glow);transition:.3s;display:flex;align-items:center;justify-content:center}
        .eye-btn:hover{transform:scale(1.1)}
        .modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.9);backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
        .modal-overlay.open{opacity:1;pointer-events:auto}
        .modal-content{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:30px;padding:30px;max-width:90%;max-height:80vh;overflow-y:auto;text-align:center}
        .modal-content h2{font-size:1.8rem;margin-bottom:20px;text-shadow:0 0 15px var(--accent)}
        .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:20px}
        .gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;border:1px solid var(--glass-border);transition:.3s;cursor:pointer}
        .gallery-grid img:hover{transform:scale(1.05);border-color:var(--accent)}

        @media(max-width:480px){
            .card{padding:20px 15px;border-radius:28px}

            .prayer-reminder{font-size:.7rem;padding:7px 10px}
            .social-link{width:36px;height:36px}
            .social-link svg{width:16px;height:16px}
            .social-links{gap:10px;margin-top:10px;padding-top:8px}
        }
    </style>
</head>

    <script>
        const CONFIG={startDate:"2026-01-08",themes:['#ff007f','#00f3ff','#ffd700','#9d00ff','#ff3366','#00ff88','#ff6b35'],symbols:['\u2764\uFE0F','\u2728','\uD83C\uDF38','\uD83D\uDC96','\uD83D\uDC95','\uD83E\uDD8B','\u2B50','\uD83C\uDF39','\uD83D\uDCAB'],memories:["Terima kasih telah hadir di hidupku.\nSetiap detik bersamamu terasa seperti mimpi yang nyata.","Senyummu adalah favoritku,\ndan tawamu adalah melodi terbaik di telingaku.","Aku mungkin tidak selalu bisa berjanji hari esok sempurna,\ntapi aku berjanji selalu ada untukmu.","You are my today and all of my tomorrows.\nAku sayang kamu!","Dunia mungkin bising,\ntapi bersamamu segalanya terasa tenang dan bermakna.","Kamu bukan hanya cintaku,\ntapi juga rumah tempatku pulang."],galleryImages:["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg"],locations:{Malang:{city:"Malang",country:"ID",method:20},Bogor:{city:"Bogor",country:"ID",method:20}},fallbackPrayers:{Malang:{Fajr:"04:28",Dhuhr:"11:58",Asr:"15:18",Maghrib:"17:52",Isha:"19:02"},Bogor:{Fajr:"04:30",Dhuhr:"12:00",Asr:"15:20",Maghrib:"17:55",Isha:"19:05"}},fallbackDate:{gregorian:"12 Agustus 2026",hijri:"17 Safar 1448 AH"},butterflyColors:['rgba(255,0,127,0.6)','rgba(0,243,255,0.5)','rgba(255,215,0,0.5)','rgba(157,0,255,0.5)','rgba(255,51,102,0.5)','rgba(0,255,136,0.4)','rgba(255,107,53,0.5)']};
        const PRAYER_NAMES={Fajr:{label:"Subuh",emoji:"\uD83C\uDF19"},Dhuhr:{label:"Dzuhur",emoji:"\u2600\uFE0F"},Asr:{label:"Ashar",emoji:"\uD83C\uDF24\uFE0F"},Maghrib:{label:"Maghrib",emoji:"\uD83C\uDF05"},Isha:{label:"Isya",emoji:"\uD83C\uDF1F"}};

        class FloatingHearts{constructor(){this.canvas=document.getElementById('hearts-canvas');this.ctx=this.canvas.getContext('2d');this.hearts=[];this.resize();window.addEventListener('resize',()=>this.resize());this.animate()}resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight}spawn(){this.hearts.push({x:Math.random()*this.canvas.width,y:this.canvas.height+10,size:Math.random()*8+4,vy:-(Math.random()*.3+.2),vx:(Math.random()-.5)*.3,opacity:Math.random()*.15+.05,wobble:Math.random()*Math.PI*2,wobbleSpeed:Math.random()*.02+.01})}drawHeart(h){const c=this.ctx,s=h.size;c.save();c.translate(h.x,h.y);c.globalAlpha=h.opacity;c.fillStyle='rgba(255,0,127,0.8)';c.beginPath();c.moveTo(0,-s*.3);c.bezierCurveTo(-s*.5,-s*.8,-s,-.1*s,0,s*.5);c.bezierCurveTo(s,-.1*s,s*.5,-s*.8,0,-s*.3);c.fill();c.restore()}animate(){this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);if(Math.random()<.03&&this.hearts.length<25)this.spawn();this.hearts=this.hearts.filter(h=>h.y>-20);this.hearts.forEach(h=>{h.y+=h.vy;h.x+=Math.sin(h.wobble)*h.vx;h.wobble+=h.wobbleSpeed;this.drawHeart(h)});requestAnimationFrame(()=>this.animate())}}

        class ButterflySystem{constructor(){this.canvas=document.getElementById('butterfly-canvas');this.ctx=this.canvas.getContext('2d');this.butterflies=[];this.tick=0;this.resize();window.addEventListener('resize',()=>this.resize());this.animate()}resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight}spawn(){const c=CONFIG.butterflyColors;this.butterflies.push({x:Math.random()*this.canvas.width,y:this.canvas.height+20,vx:(Math.random()-.5)*.8,vy:-(Math.random()*1.2+.5),size:Math.random()*12+8,color:c[Math.floor(Math.random()*c.length)],wingPhase:Math.random()*Math.PI*2,wingSpeed:Math.random()*.15+.08,driftOffset:Math.random()*Math.PI*2,driftAmp:Math.random()*1.5+.5,life:0,maxLife:Math.random()*400+500})}drawButterfly(b){const c=this.ctx,w=Math.abs(Math.sin(b.wingPhase));c.save();c.translate(b.x,b.y);c.globalAlpha=Math.min(b.life/30,1,(b.maxLife-b.life)/30);c.save();c.scale(-w,1);c.beginPath();c.ellipse(b.size*.6,-b.size*.2,b.size*.7,b.size*.45,-.3,0,Math.PI*2);c.fillStyle=b.color;c.fill();c.beginPath();c.ellipse(b.size*.4,b.size*.3,b.size*.45,b.size*.3,.2,0,Math.PI*2);c.fillStyle=b.color;c.fill();c.restore();c.save();c.scale(w,1);c.beginPath();c.ellipse(b.size*.6,-b.size*.2,b.size*.7,b.size*.45,.3,0,Math.PI*2);c.fillStyle=b.color;c.fill();c.beginPath();c.ellipse(b.size*.4,b.size*.3,b.size*.45,b.size*.3,-.2,0,Math.PI*2);c.fillStyle=b.color;c.fill();c.restore();c.beginPath();c.ellipse(0,0,b.size*.08,b.size*.5,0,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.7)';c.fill();c.restore()}animate(){this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);this.tick++;if(this.tick%50===0&&this.butterflies.length<15)this.spawn();this.butterflies=this.butterflies.filter(b=>b.life<b.maxLife&&b.y>-50);this.butterflies.forEach(b=>{b.life++;b.wingPhase+=b.wingSpeed;b.x+=b.vx+Math.sin(this.tick*.02+b.driftOffset)*b.driftAmp*.3;b.y+=b.vy;this.drawButterfly(b)});requestAnimationFrame(()=>this.animate())}}

        class RomanticPortal{
            constructor(){
                this.memIdx=0;this.typewriterTimer=null;this.typewriterDone=false;
                this.autoAdvance=true;this.autoTimer=null;this.autoInterval=8000;
                this.particles=[];this.audioUnlocked=false;this.lastPrayerShown='';
                this.prayerHideTimer=null;this.currentCity='Malang';this.prayerTimes=null;
                this.touchStartX=0;this.touchStartY=0;this.longPressTimer=null;this.longPressTriggered=false;
                this.isTouchDevice='ontouchstart' in window||navigator.maxTouchPoints>0;
                this.canvas=document.getElementById('particle-canvas');this.ctx=this.canvas.getContext('2d');
                this.els={card:document.getElementById('card'),video:document.getElementById('bg-video'),audio:document.getElementById('audio'),text:document.getElementById('text'),vis:document.getElementById('vis'),counter:document.getElementById('date-counter'),title:document.getElementById('title'),dots:document.getElementById('dots'),modal:document.getElementById('gallery-modal'),galleryGrid:document.getElementById('gallery-grid'),musicBtn:document.getElementById('music-btn'),prayerReminder:document.getElementById('prayer-reminder'),scheduleDisplay:document.getElementById('prayer-schedule-display'),citySelect:document.getElementById('city-select'),liveClock:document.getElementById('live-clock'),dateGregorian:document.getElementById('date-gregorian'),dateHijri:document.getElementById('date-hijri'),progressFill:document.getElementById('progress-fill'),autoBtn:document.getElementById('auto-btn')};
                this.resizeCanvas();window.addEventListener('resize',()=>this.resizeCanvas());
                this.setupInteractions();this.setupAutoUnlock();this.init();
                new FloatingHearts();new ButterflySystem();
            }

            setupInteractions(){
                const tb=this.els.text;
                if(this.isTouchDevice){
                    tb.addEventListener('touchstart',e=>{
                        this.touchStartX=e.changedTouches[0].screenX;
                        this.touchStartY=e.changedTouches[0].screenY;
                        this.longPressTriggered=false;
                        this.longPressTimer=setTimeout(()=>{
                            this.longPressTriggered=true;
                            tb.classList.add('long-press-feedback');
                            setTimeout(()=>tb.classList.remove('long-press-feedback'),200);
                            this.jumpToRandom();
                        },600);
                    },{passive:true});
                    tb.addEventListener('touchend',e=>{
                        clearTimeout(this.longPressTimer);
                        if(this.longPressTriggered)return;
                        const dx=e.changedTouches[0].screenX-this.touchStartX;
                        const dy=e.changedTouches[0].screenY-this.touchStartY;
                        if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){
                            this.resetAutoTimer();
                            if(dx<0)this.nextMemory();else this.prevMemory();
                        }else if(Math.abs(dx)<10&&Math.abs(dy)<10){
                            this.resetAutoTimer();
                            this.nextMemory();
                        }
                    },{passive:true});
                }else{
                    tb.addEventListener('mousedown',()=>{
                        this.longPressTriggered=false;
                        this.longPressTimer=setTimeout(()=>{
                            this.longPressTriggered=true;
                            tb.classList.add('long-press-feedback');
                            setTimeout(()=>tb.classList.remove('long-press-feedback'),200);
                            this.jumpToRandom();
                        },600);
                    });
                    tb.addEventListener('mouseup',()=>{
                        clearTimeout(this.longPressTimer);
                        if(!this.longPressTriggered){this.resetAutoTimer();this.nextMemory();}
                    });
                    tb.addEventListener('mouseleave',()=>clearTimeout(this.longPressTimer));
                }
            }

            setupAutoUnlock(){
                const unlock=()=>{if(!this.audioUnlocked){this.els.audio.play().then(()=>{this.audioUnlocked=true;this.els.vis.classList.add('active');this.els.musicBtn.innerText='Pause \u23F8\uFE0F'}).catch(()=>{})}document.removeEventListener('click',unlock);document.removeEventListener('touchstart',unlock)};
                document.addEventListener('click',unlock,{once:true});document.addEventListener('touchstart',unlock,{once:true});
            }

            async init(){
                this.initCounter();this.updateClock();this.updateGreeting();this.initDots();
                this.els.text.style.transition="opacity 0.4s ease";
                this.typeText(CONFIG.memories[0]);this.updateProgress();this.animateParticles();
                this.els.autoBtn.classList.add('active-toggle');
                await this.fetchPrayerTimes(this.currentCity);
                setInterval(()=>this.onTick(),1000);setInterval(()=>this.refreshIfMidnight(),60000);
                this.startAutoTimer();
            }

            onTick(){this.updateClock();this.updateGreeting();this.checkPrayerTime()}
            refreshIfMidnight(){const n=new Date();if(n.getHours()===0&&n.getMinutes()===0)this.fetchPrayerTimes(this.currentCity)}
            resizeCanvas(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight}
            initCounter(){this.els.counter.innerText="\u2764\uFE0F "+Math.floor((new Date()-new Date(CONFIG.startDate))/86400000)+" Hari Bersama \u2764\uFE0F"}
            updateClock(){const n=new Date();this.els.liveClock.innerText=String(n.getHours()).padStart(2,'0')+":"+String(n.getMinutes()).padStart(2,'0')+":"+String(n.getSeconds()).padStart(2,'0');this.els.dateGregorian.innerText=DAYS_ID[n.getDay()]+", "+n.getDate()+" "+MONTHS_ID[n.getMonth()]+" "+n.getFullYear()}
            updateGreeting(){const h=new Date().getHours();let g="";if(h>=4&&h<6)g="Selamat Subuh MyLup \uD83C\uDF19";else if(h>=6&&h<11)g="Selamat Pagi Bubu \u2728";else if(h>=11&&h<15)g="Selamat Siang Sayang \u2600\uFE0F";else if(h>=15&&h<18)g="Selamat Sore Cintaku \uD83C\uDF05";else if(h>=18&&h<21)g="Selamat Malam MyLove \uD83C\uDF19";else g="Jangan Begadang Ya Sayang \uD83D\uDE34";if(this.els.title.innerText!==g){this.els.title.style.opacity=0;setTimeout(()=>{this.els.title.innerText=g;this.els.title.style.opacity=1;this.els.title.classList.remove('pulse');void this.els.title.offsetWidth;this.els.title.classList.add('pulse')},300)}}

            finishTypewriter(){
                clearTimeout(this.typewriterTimer);
                this.typewriterDone=true;
                this.els.text.innerText=CONFIG.memories[this.memIdx];
                this.els.text.style.opacity=1;
            }

            nextMemory(){
                this.finishTypewriter();
                this.memIdx=(this.memIdx+1)%CONFIG.memories.length;
                this.els.text.style.opacity=0;
                setTimeout(()=>{this.typeText(CONFIG.memories[this.memIdx]);this.updateDots();this.updateProgress()},300);
                this.resetAutoTimer();
            }

            prevMemory(){
                this.finishTypewriter();
                this.memIdx=(this.memIdx-1+CONFIG.memories.length)%CONFIG.memories.length;
                this.els.text.style.opacity=0;
                setTimeout(()=>{this.typeText(CONFIG.memories[this.memIdx]);this.updateDots();this.updateProgress()},300);
                this.resetAutoTimer();
            }

            jumpToRandom(){
                this.finishTypewriter();
                let r;do{r=Math.floor(Math.random()*CONFIG.memories.length)}while(r===this.memIdx);
                this.memIdx=r;this.els.text.style.opacity=0;
                setTimeout(()=>{this.typeText(CONFIG.memories[this.memIdx]);this.updateDots();this.updateProgress()},200);
                this.resetAutoTimer();
            }

            typeText(text){
                this.els.text.innerText='';this.typewriterDone=false;let i=0;const speed=25;
                const type=()=>{if(i<text.length){this.els.text.innerText+=text.charAt(i);i++;this.typewriterTimer=setTimeout(type,speed)}else{this.typewriterDone=true;this.els.text.style.opacity=1;if(this.autoAdvance)this.startAutoTimer()}};
                this.els.text.style.opacity=1;type();
            }

            toggleAutoAdvance(){this.autoAdvance=!this.autoAdvance;this.els.autoBtn.classList.toggle('active-toggle',this.autoAdvance);if(this.autoAdvance)this.startAutoTimer();else clearTimeout(this.autoTimer)}
            startAutoTimer(){clearTimeout(this.autoTimer);if(this.autoAdvance&&this.typewriterDone)this.autoTimer=setTimeout(()=>this.nextMemory(),this.autoInterval)}
            resetAutoTimer(){if(this.autoAdvance){clearTimeout(this.autoTimer);this.startAutoTimer()}}

            updateDots(){[...this.els.dots.children].forEach((d,i)=>d.classList.toggle('active',i===this.memIdx))}
            updateProgress(){this.els.progressFill.style.width=((this.memIdx+1)/CONFIG.memories.length)*100+'%'}
            initDots(){this.els.dots.innerHTML='';CONFIG.memories.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' active':'');this.els.dots.appendChild(d)})}

            async onLocationChange(city){this.currentCity=city;this.lastPrayerShown='';this.els.prayerReminder.classList.remove('show');this.els.scheduleDisplay.innerText="Memuat jadwal "+city+"...";this.els.dateHijri.innerText="Memuat kalender Hijriah...";await this.fetchPrayerTimes(city)}
            async fetchPrayerTimes(city){const loc=CONFIG.locations[city];const t=new Date();const ds=t.getDate()+"-"+(t.getMonth()+1)+"-"+t.getFullYear();const url="https://api.aladhan.com/v1/timingsByCity/"+ds+"?city="+loc.city+"&country="+loc.country+"&method="+loc.method;try{const r=await fetch(url);const j=await r.json();if(j.code===200&&j.data&&j.data.timings){this.prayerTimes=j.data.timings;this.updateCalendarFromAPI(j.data.date);this.displaySchedule()}else this.useFallback(city)}catch(e){this.useFallback(city)}}
            updateCalendarFromAPI(d){if(!d)return;if(d.readable)this.els.dateGregorian.innerText=d.readable;if(d.hijri){const h=d.hijri;this.els.dateHijri.innerText=(h.weekday&&h.weekday.ar?h.weekday.ar:"")+" "+(h.day||"")+" "+(h.month&&h.month.en?h.month.en:"")+" "+(h.year||"")+" H"}}
            useFallback(city){this.prayerTimes=CONFIG.fallbackPrayers[city]||CONFIG.fallbackPrayers.Malang;this.els.dateGregorian.innerText=CONFIG.fallbackDate.gregorian;this.els.dateHijri.innerText=CONFIG.fallbackDate.hijri;this.displaySchedule()}
            displaySchedule(){if(!this.prayerTimes)return;const p=[];['Fajr','Dhuhr','Asr','Maghrib','Isha'].forEach(k=>p.push(PRAYER_NAMES[k].label+" "+this.prayerTimes[k]));this.els.scheduleDisplay.innerText="\uD83D\uDD50 "+this.currentCity+": "+p.join(" | ")}
            checkPrayerTime(){if(!this.prayerTimes)return;const n=new Date();const ct=String(n.getHours()).padStart(2,'0')+":"+String(n.getMinutes()).padStart(2,'0');['Fajr','Dhuhr','Asr','Maghrib','Isha'].forEach(k=>{if(this.prayerTimes[k]===ct&&this.lastPrayerShown!==k){this.lastPrayerShown=k;this.showPrayerReminder(k)}})}
            showPrayerReminder(key){const info=PRAYER_NAMES[key];clearTimeout(this.prayerHideTimer);this.els.prayerReminder.innerHTML=info.emoji+" Waktunya Sholat "+info.label+" "+info.emoji+"<br><small>Jangan lupa ya sayang \u2764\uFE0F | "+this.currentCity+"</small>";this.els.prayerReminder.classList.add('show');this.prayerHideTimer=setTimeout(()=>this.els.prayerReminder.classList.remove('show'),60000)}

            toggleCard(){this.els.card.classList.toggle('hidden');this.els.video.style.opacity=this.els.card.classList.contains('hidden')?'1':'0.35'}
            toggleAudio(){if(this.els.audio.paused){const p=this.els.audio.play();if(p!==undefined)p.then(()=>{this.audioUnlocked=true;this.els.vis.classList.add('active');this.els.musicBtn.innerText='Pause \u23F8\uFE0F'}).catch(()=>{this.els.musicBtn.innerText='Klik Lagi \uD83C\uDFB5'})}else{this.els.audio.pause();this.els.vis.classList.remove('active');this.els.musicBtn.innerText='Musik \uD83C\uDFB5'}}
            changeTheme(){const c=CONFIG.themes[Math.floor(Math.random()*CONFIG.themes.length)];document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-glow',c+'66')}
            triggerParticles(){for(let i=0;i<60;i++)this.particles.push({x:Math.random()*this.canvas.width,y:-20,vx:(Math.random()-.5)*2,vy:Math.random()*3+1,size:Math.random()*18+10,symbol:CONFIG.symbols[Math.floor(Math.random()*CONFIG.symbols.length)],rotation:Math.random()*360,rotSpeed:(Math.random()-.5)*4,life:1})}
            animateParticles(){this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);this.particles=this.particles.filter(p=>p.life>0);this.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rotation+=p.rotSpeed;p.life-=.003;this.ctx.save();this.ctx.translate(p.x,p.y);this.ctx.rotate(p.rotation*Math.PI/180);this.ctx.globalAlpha=Math.max(p.life,0);this.ctx.font=p.size+'px serif';this.ctx.textAlign='center';this.ctx.textBaseline='middle';this.ctx.fillText(p.symbol,0,0);this.ctx.restore()});requestAnimationFrame(()=>this.animateParticles())}
            showGallery(){this.els.galleryGrid.innerHTML='';CONFIG.galleryImages.forEach(src=>{const img=document.createElement('img');img.src=src;img.loading='lazy';img.alt='Momen bersama';img.onerror=function(){this.style.display='none'};img.onclick=()=>this.closeGallery(null,true);this.els.galleryGrid.appendChild(img)});this.els.modal.classList.add('open')}
            closeGallery(e,force){if(force||(e&&e.target===this.els.modal))this.els.modal.classList.remove('open')}
            showSurprise(){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.9);backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;';o.innerHTML='<div style="text-align:center;color:white;padding:40px;max-width:350px;"><div style="font-size:3.5rem;margin-bottom:20px;animation:bounce 1s infinite alternate;">\uD83D\uDC8C</div><p style="font-size:1.3rem;line-height:1.9;font-family:\'Dancing Script\',cursive;">Terima kasih sudah menjadi alasan aku bahagia.<br><strong style="font-size:1.6rem;">I Love You Forever!</strong></p><button onclick="this.parentElement.parentElement.remove()" style="margin-top:25px;padding:14px 35px;border-radius:25px;border:none;background:var(--accent);color:white;font-size:1rem;cursor:pointer;font-family:inherit;">Tutup \uD83D\uDC95</button></div>';document.body.appendChild(o);requestAnimationFrame(()=>o.style.opacity=1)}
        }

        const app=new RomanticPortal();
    </script>
